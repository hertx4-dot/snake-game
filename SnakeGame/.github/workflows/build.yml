name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project SnakeGame.xcodeproj \
            -scheme SnakeGame \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SnakeGame.app Payload/
          zip -r SnakeGame.ipa Payload
          ls -la SnakeGame.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-unsigned-ipa
          path: SnakeGame.ipa
          retention-days: 30
